<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ONE VERSE — make your self</title>
<style>
  :root { --ink: #f2efe6; --dim: #8fa8b4; --gold: #c9a227; --line: #1d3b4a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #06121a; color: var(--ink);
    font: 14px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header { padding: 22px 26px 6px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .26em; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; letter-spacing: .1em; }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 420px);
    gap: 22px; padding: 14px 26px 40px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  #stage { background: radial-gradient(circle at 50% 38%, #0d3344 0%, #06121a 72%);
    border: 1px solid var(--line); min-height: 470px; display: block; width: 100%; }
  aside { border: 1px solid var(--line); padding: 16px 18px; background: rgba(6,18,26,.7); }
  label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 12px; letter-spacing: .08em; }
  input, select { width: 100%; background: #04101a; color: var(--ink); border: 1px solid var(--line);
    padding: 8px 10px; font: inherit; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .facts { margin-top: 14px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line);
    padding-top: 12px; }
  .facts b { color: var(--gold); font-weight: 600; }
  button { margin-top: 16px; width: 100%; background: transparent; border: 1px solid var(--gold);
    color: var(--gold); padding: 10px; font: inherit; letter-spacing: .16em; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #out { margin-top: 12px; font-size: 12px; min-height: 20px; color: #9fe0b0; }
  #out.err { color: #ffb4a2; }
  a { color: var(--gold); text-decoration: none; }
  .hint { font-size: 11px; color: #6f8792; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>MAKE YOUR SELF</h1>
  <div class="sub">derived from the world · declared by you · committed as a row</div>
</header>

<main>
  <canvas id="stage"></canvas>

  <aside>
    <label>name</label>
    <input id="name" maxlength="40" value="captain" />

    <div class="row2">
      <div>
        <label>species</label>
        <select id="species"></select>
      </div>
      <div>
        <label>element</label>
        <select id="element"></select>
      </div>
    </div>

    <label>mark</label>
    <select id="mark"></select>

    <label>style <span style="color:#6f8792">(how it is DRAWN — not what it IS)</span></label>
    <select id="style">
      <option value="figure">figure</option>
      <option value="bot">bot</option>
      <option value="glyph">glyph</option>
    </select>

    <div class="facts" id="facts">reading the world…</div>

    <button id="commit">COMMIT MY SELF</button>
    <div id="out"></div>
    <div class="hint">
      the preview is computed by the SAME code that commits, so what you see is what the chain will hold.
      designing is public; <b>committing happens on the captain's door</b> (<code>:8473</code>).
    </div>
    <div class="hint"><a href="/">← back to the gate</a></div>
  </aside>
</main>

<script>
"use strict";
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const el = id => document.getElementById(id);
let shown = null, timer = null;

const ELEMENT_HUE = { flame: 18, tide: 196, stone: 38, wind: 150, static: 276, void: 262 };
const SPECIES = {
  human: { h: 1.00, w: 1.00, head: 1.00 }, giant: { h: 1.22, w: 1.28, head: 1.10 },
  mink: { h: 0.94, w: 0.92, head: 1.04 }, fishman: { h: 1.04, w: 1.12, head: 1.06 },
  sky: { h: 0.98, w: 0.94, head: 1.02 }, construct: { h: 1.06, w: 1.06, head: 1.12 }
};

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!shown) return;
  const d = shown.derived || {}, dec = shown.declared || {};
  const sp = SPECIES[dec.species] || SPECIES.human;
  const hue = d.hue != null ? d.hue : 200;
  const scale = 0.55 + ((d.height_cm || 170) - 120) / 110 * 0.45;
  const bodyH = H * 0.62 * scale * sp.h;
  const bodyW = bodyH * 0.30 * (d.build || 1) * sp.w;
  const cx = W / 2, baseY = H * 0.86;
  const auraHue = ELEMENT_HUE[dec.element] != null ? ELEMENT_HUE[dec.element] : 200;

  /* STYLE is how a self is DRAWN, never what it IS: the same eight numbers, three renderers.
     Borrowed idea, own code: identity = seed, renderer = a pure function anyone can write. */
  const style = el("style") ? el("style").value : "figure";
  if (style === "bot") { drawBot(W, H, d, dec, hue, auraHue); return; }
  if (style === "glyph") { drawGlyph(W, H, d, dec, hue, auraHue); return; }

  const g = ctx.createRadialGradient(cx, baseY - bodyH * 0.55, 10, cx, baseY - bodyH * 0.55, bodyH * 0.95);
  g.addColorStop(0, "hsla(" + auraHue + ",80%,60%," + (0.10 + (d.aura || 0) * 0.35).toFixed(3) + ")");
  g.addColorStop(1, "hsla(" + auraHue + ",80%,60%,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, baseY - bodyH * 0.55, bodyH * 0.95, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = "hsl(" + hue + ",40%,62%)";
  ctx.lineWidth = bodyW * 0.16; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - bodyW * 0.18, baseY - bodyH * 0.42); ctx.lineTo(cx - bodyW * 0.22, baseY);
  ctx.moveTo(cx + bodyW * 0.18, baseY - bodyH * 0.42); ctx.lineTo(cx + bodyW * 0.22, baseY);
  ctx.stroke();

  const topY = baseY - bodyH * 0.86;
  ctx.fillStyle = "hsl(" + hue + ",34%,48%)";
  ctx.beginPath();
  ctx.moveTo(cx - bodyW * 0.5, topY + bodyH * 0.14);
  ctx.lineTo(cx + bodyW * 0.5, topY + bodyH * 0.14);
  ctx.lineTo(cx + bodyW * 0.34, baseY - bodyH * 0.38);
  ctx.lineTo(cx - bodyW * 0.34, baseY - bodyH * 0.38);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "hsla(" + hue + ",50%,75%,.35)"; ctx.lineWidth = 1; ctx.stroke();

  ctx.strokeStyle = "hsl(" + hue + ",30%,45%)"; ctx.lineWidth = bodyW * 0.13;
  ctx.beginPath();
  ctx.moveTo(cx - bodyW * 0.46, topY + bodyH * 0.20); ctx.lineTo(cx - bodyW * 0.62, baseY - bodyH * 0.40);
  ctx.moveTo(cx + bodyW * 0.46, topY + bodyH * 0.20); ctx.lineTo(cx + bodyW * 0.62, baseY - bodyH * 0.40);
  ctx.stroke();

  const headR = bodyW * 0.26 * sp.head;
  const headY = topY + bodyH * 0.02;
  ctx.fillStyle = "hsl(" + hue + ",28%,58%)";
  if (dec.species === "construct") {
    ctx.fillRect(cx - headR, headY - headR, headR * 2, headR * 2);
  } else {
    ctx.beginPath(); ctx.arc(cx, headY, headR, 0, Math.PI * 2); ctx.fill();
  }
  if (dec.species === "mink") {
    ctx.beginPath(); ctx.arc(cx - headR * 0.7, headY - headR * 0.8, headR * 0.34, 0, Math.PI * 2);
    ctx.arc(cx + headR * 0.7, headY - headR * 0.8, headR * 0.34, 0, Math.PI * 2); ctx.fill();
  }
  if (dec.species === "fishman") {
    ctx.beginPath(); ctx.moveTo(cx, headY - headR); ctx.lineTo(cx + headR * 0.5, headY - headR * 1.7);
    ctx.lineTo(cx + headR * 0.9, headY - headR); ctx.closePath(); ctx.fill();
  }

  /* THE FACE.  Not a photograph, not a template: eyes, mouth and fringe read off the record.
     eye SPACING from build · eye SIZE from aura · mouth WIDTH from voice_pitch · fringe SWEEP from gait.
     A low-aura body has small eyes and a closed mouth; a bright one is wide awake. */
  const eyeDX = headR * (0.30 + (d.build || 1) * 0.10);
  const eyeR = Math.max(1, headR * (0.07 + (d.aura || 0) * 0.10));
  ctx.fillStyle = "rgba(6,18,26,.82)";
  ctx.beginPath();
  ctx.arc(cx - eyeDX, headY - headR * 0.12, eyeR, 0, Math.PI * 2);
  ctx.arc(cx + eyeDX, headY - headR * 0.12, eyeR, 0, Math.PI * 2);
  ctx.fill();

  const mouthW = headR * Math.max(0.18, Math.min(0.55, 0.12 + (d.voice_pitch || 1.2) * 0.22));
  ctx.strokeStyle = "rgba(6,18,26,.55)"; ctx.lineWidth = Math.max(1, headR * 0.07);
  ctx.beginPath();
  ctx.moveTo(cx - mouthW, headY + headR * 0.42);
  ctx.quadraticCurveTo(cx, headY + headR * (0.42 + (d.aura || 0) * 0.20), cx + mouthW, headY + headR * 0.42);
  ctx.stroke();

  /* the fringe: an arc whose sweep is the gait -- hair, not a helmet */
  ctx.strokeStyle = "hsla(" + hue + ",45%,72%,.55)"; ctx.lineWidth = Math.max(1, headR * 0.10);
  const fringeSweep = Math.min(1, Math.max(0, ((d.gait || 1) - 0.85) / 0.5));
  ctx.beginPath();
  ctx.arc(cx, headY - headR * 0.10, headR * 0.98, Math.PI * 1.05, Math.PI * (1.55 + fringeSweep * 0.5));
  ctx.stroke();

  const mx = cx, my = topY + bodyH * 0.34;
  ctx.save();
  ctx.strokeStyle = "#f2efe6"; ctx.fillStyle = "#f2efe6"; ctx.lineWidth = 2;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (dec.mark === "0" || dec.mark == null) {
    ctx.font = Math.round(bodyW * 0.34) + "px ui-monospace, monospace";
    ctx.fillText("0", mx, my);
  } else if (dec.mark === "flame") {
    ctx.beginPath(); ctx.moveTo(mx, my - 12); ctx.quadraticCurveTo(mx + 10, my, mx, my + 12);
    ctx.quadraticCurveTo(mx - 10, my, mx, my - 12); ctx.stroke();
  } else if (dec.mark === "anchor") {
    ctx.beginPath(); ctx.arc(mx, my - 8, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx, my - 4); ctx.lineTo(mx, my + 12);
    ctx.moveTo(mx - 9, my + 4); ctx.lineTo(mx + 9, my + 4); ctx.stroke();
  } else if (dec.mark === "eye") {
    ctx.beginPath(); ctx.ellipse(mx, my, 13, 7, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.font = "11px ui-monospace, monospace"; ctx.fillStyle = "rgba(143,168,180,.9)";
  ctx.textAlign = "center";
  ctx.fillText("urn:0z:self:" + (d.sigil || "??????") + " · hue " + hue + " · " + (d.height_cm || "?") +
    " cm · build " + (d.build || "?") + " · aura " + (d.aura || "?"), cx, H - 16);
}

function drawBot(W, H, d, dec, hue, auraHue) {
  /* a geometric self: roundness from build, height from the scale, eyes from the seed's own digits */
  const s = Math.min(W, H) * 0.30 * (0.7 + ((d.height_cm || 170) - 120) / 110 * 0.3);
  const cx = W / 2, cy = H * 0.46;
  const r = 0.18 + Math.min(0.3, Math.max(0, (d.build || 1) - 0.7) * 0.4);
  ctx.fillStyle = "hsla(" + hue + ",40%,20%,.9)";
  ctx.strokeStyle = "hsl(" + hue + ",45%,55%)";
  ctx.lineWidth = 2;
  roundRect(cx - s, cy - s * 0.9, s * 2, s * 1.8, s * r);
  ctx.fill(); ctx.stroke();

  const g = ctx.createRadialGradient(cx, cy, s * 0.2, cx, cy, s * 1.9);
  g.addColorStop(0, "hsla(" + auraHue + ",85%,60%,.22)");
  g.addColorStop(1, "hsla(" + auraHue + ",85%,60%,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, s * 1.9, 0, Math.PI * 2); ctx.fill();

  const hex = String(d.seed || "000000");
  const eye = s * 0.22, gap = s * 0.42;
  ctx.fillStyle = "#f2efe6";
  for (let i = 0; i < 2; i++) {
    const ex = cx + (i ? gap : -gap);
    const blink = parseInt(hex[i * 2 + 2] || "8", 16) > 12;   // a derived blink, stable for a seed
    ctx.beginPath();
    if (blink) { ctx.fillRect(ex - eye, cy - s * 0.12, eye * 2, 3); }
    else { ctx.arc(ex, cy - s * 0.1, eye, 0, Math.PI * 2); ctx.fill(); }
  }
  /* the mark is a light, not a glyph, on a machine */
  const lit = dec.mark !== "none";
  ctx.strokeStyle = lit ? "hsl(" + auraHue + ",90%,65%)" : "hsla(" + hue + ",30%,45%,.5)";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - s * 0.34, cy + s * 0.42); ctx.lineTo(cx + s * 0.34, cy + s * 0.42); ctx.stroke();
  /* the sigil's digits as a bar code under the body: the address, visible */
  ctx.font = "11px ui-monospace, monospace"; ctx.fillStyle = "rgba(143,168,180,.9)";
  ctx.textAlign = "center";
  ctx.fillText("urn:0z:self:" + (d.sigil || "??????") + " · " + (d.height_cm || "?") + " cm · build " + (d.build || "?"),
               cx, H - 16);
}

function drawGlyph(W, H, d, dec, hue, auraHue) {
  /* an identicon from OUR seed: a 5x5 mirror grid, the same five bits on every machine */
  const hex = String(d.seed || "000000000000");
  const cell = Math.min(W, H) * 0.11;
  const ox = W / 2 - cell * 2.5, oy = H * 0.5 - cell * 2.5;
  ctx.fillStyle = "hsla(" + auraHue + ",80%,55%,.14)";
  ctx.beginPath(); ctx.arc(W / 2, H * 0.5, cell * 4.2, 0, Math.PI * 2); ctx.fill();
  for (let y = 0; y < 5; y++) {
    for (let x = 0; x < 3; x++) {
      const bit = parseInt(hex[(y * 3 + x) % hex.length] || "0", 16);
      if (bit % 2 === 0) { continue; }
      const light = 40 + (bit % 5) * 6;
      ctx.fillStyle = "hsl(" + hue + ",55%," + light + "%)";
      ctx.fillRect(ox + x * cell, oy + y * cell, cell - 2, cell - 2);
      ctx.fillRect(ox + (4 - x) * cell, oy + y * cell, cell - 2, cell - 2);   // mirror
    }
  }
  ctx.font = "11px ui-monospace, monospace"; ctx.fillStyle = "rgba(143,168,180,.9)";
  ctx.textAlign = "center";
  ctx.fillText("urn:0z:self:" + (d.sigil || "??????") + " · glyph", W / 2, H - 16);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>


<script>
"use strict";
/* the editor half: preview comes from the SERVER (one implementation), commit only exists on :8473 */
function out(msg, isErr) {
  el("out").textContent = msg || "";
  el("out").className = isErr ? "err" : "";
}

function fillSelect(id, values) {
  el(id).innerHTML = values.map(v => '<option value="' + v + '">' + v + "</option>").join("");
}

/* the draft: what you typed is yours, and it survives a reload, a crash, and the crossing to the
   other origin (via the URL).  It is NOT a claim: it never touches the chain. */
function draftGet(k) {
  try { return localStorage.getItem("oz_draft_" + k) || ""; } catch (e) { return ""; }
}

function remember() {
  const q = new URLSearchParams();
  ["name", "species", "element", "mark"].forEach(k => {
    const v = el(k).value;
    try { localStorage.setItem("oz_draft_" + k, v); } catch (e) { /* private mode */ }
    q.set(k, v);
  });
  try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (e) { /* no history */ }
}

function doorUrl() {
  const q = new URLSearchParams();
  ["name", "species", "element", "mark"].forEach(k => q.set(k, el(k).value));
  return "http://127.0.0.1:8473/config.html?" + q.toString();
}

async function preview() {
  const q = new URLSearchParams({
    name: el("name").value || "captain",
    species: el("species").value, element: el("element").value, mark: el("mark").value
  });
  try {
    const r = await fetch("/api/player/preview?" + q.toString());
    const j = await r.json();
    if (!r.ok) { out(j.error || ("HTTP " + r.status), true); return; }
    shown = j;
    const d = j.derived || {};
    el("facts").innerHTML =
      "seed <b>" + String(d.seed || "").slice(0, 16) + "</b> (planet " + (d.planet_seed || "?") + ")<br />" +
      "hue <b>" + d.hue + "</b> · height <b>" + d.height_cm + " cm</b> · build <b>" + d.build + "</b><br />" +
      "voice <b>" + d.voice_pitch + "</b> · gait <b>" + d.gait + "</b> · aura <b>" + d.aura + "</b>" +
      " · sigil <b>" + d.sigil + "</b>" +
      (j.twin
        ? "<br />THE D · your double: <b>" + String(j.twin.sigil) + "</b> · hue " + j.twin.hue +
          " · " + j.twin.height_cm + " cm -- the same self, mirrored"
        : "") +
      (j.committed ? "<br />committed: <b>" + String(j.committed.row).slice(0, 16) + "</b> at " + j.committed.ts
                   : "<br />not committed yet");
    draw();
  } catch (e) { out("the gate is not answering", true); }
}

async function boot() {
  const cfg = await fetch("/api/player").then(r => r.json()).catch(() => null);
  if (cfg && cfg.declared) {
    fillSelect("species", cfg.species_allowed || []);
    fillSelect("element", cfg.element_allowed || []);
    fillSelect("mark", cfg.mark_allowed || []);
  } else {
    fillSelect("species", ["human", "giant", "mink", "fishman", "sky", "construct"]);
    fillSelect("element", ["flame", "tide", "stone", "wind", "static", "void"]);
    fillSelect("mark", ["0", "flame", "anchor", "eye", "none"]);
  }

  /* NOTHING TYPED IS EVER LOST AGAIN.
     MEASURED 2026-10-20: the captain chose a name with care, the door reloaded "captain", and the
     name was gone -- it had only ever lived in an <input>.  A design that forgets the one word a
     human chose is not minimal, it is careless.  So: URL first (it survives crossing the two
     origins), then this browser's draft, then the server's committed/declared value. */
  const q = new URLSearchParams(location.search);
  const pick = (k, fallback) => q.get(k) || draftGet(k) || fallback;
  el("name").value = pick("name", (cfg && cfg.declared && cfg.declared.name) || "captain");
  el("species").value = pick("species", (cfg && cfg.declared && cfg.declared.species) || "human");
  el("element").value = pick("element", (cfg && cfg.declared && cfg.declared.element) || "flame");
  el("mark").value = pick("mark", (cfg && cfg.declared && cfg.declared.mark) || "0");

  fit();
  window.addEventListener("resize", fit);
  ["name", "species", "element", "mark"].forEach(id =>
    el(id).addEventListener("input", () => {
      remember();                       // the draft, immediately, on every keystroke
      clearTimeout(timer); timer = setTimeout(preview, 180);
    }));
  remember();

  /* STYLE lives in this browser only: it changes nothing on the chain, so it must not call the
     server and must not touch the commit. */
  try { el("style").value = localStorage.getItem("oz_style") || "figure"; } catch (e) { /* private mode */ }
  el("style").addEventListener("change", () => {
    try { localStorage.setItem("oz_style", el("style").value); } catch (e) { /* private mode */ }
    draw();
  });

  await preview();

  /* the two doors: designing is public, committing happens where you are PRESENT */
  const local = ["127.0.0.1", "localhost", "::1"].indexOf(location.hostname) >= 0;
  const isDoor = location.port === "8473";
  if (!isDoor) {
    if (local) {
      el("commit").textContent = "OPEN THE CAPTAIN'S DOOR →";
    } else {
      el("commit").textContent = "DESIGN ONLY";
      el("commit").disabled = true;
    }
  }

  el("commit").addEventListener("click", async () => {
    if (!isDoor) {
      if (local) { location.href = doorUrl(); }
      return;
    }
    el("commit").disabled = true; out("committing…");
    try {
      const r = await fetch("/api/player", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: el("name").value, species: el("species").value,
                               element: el("element").value, mark: el("mark").value })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        out("COMMITTED " + String((j.committed || {}).row || "").slice(0, 16) +
            " — your body is on the chain");
        await preview();
      } else {
        out((j.error || ("HTTP " + r.status)) + (j.detail ? " · " + j.detail : ""), true);
      }
    } catch (e) { out("the gate is not answering", true); }
    el("commit").disabled = false;
  });
}
boot();
</script>
</body>
</html>
