<style>

  .sigil { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;

  /* ══ THE VAULT — HD pass, 2026-10-24 ═════════════════════════════════════════════════════════
     Pure CSS on purpose: no image file, no CDN, nothing to 404 on a phone in a tunnel.  The depth
     comes from four stacked radial gradients (two warm rims, one cold skylight, one black floor),
     the arcane circle from hard-edged rings, and the glass from an inner highlight at 34%/28% —
     the trick window-glass uses.  It reads as a photograph at a glance and costs 0 bytes. */
  body { background:#03060a; }
  .bg { position:fixed; inset:0; z-index:0; pointer-events:none;
        background:
          radial-gradient(62% 44% at 6% 40%, rgba(232,150,54,.11), transparent 72%),
          radial-gradient(62% 44% at 94% 62%, rgba(232,150,54,.09), transparent 72%),
          radial-gradient(56% 50% at 50% 6%, rgba(96,148,190,.11), transparent 74%),
          radial-gradient(130% 95% at 50% 112%, rgba(0,0,0,.95), transparent 62%),
          linear-gradient(#05080c, #020406 62%, #000); }
  .bg::before { content:""; position:absolute; inset:-12%;
        background:
          radial-gradient(circle at 50% 46%, rgba(224,188,69,.06) 0 21.4%, transparent 21.8%),
          radial-gradient(circle at 50% 46%, transparent 0 33.6%, rgba(224,188,69,.055) 34%, transparent 34.4%),
          radial-gradient(circle at 50% 46%, transparent 0 45.4%, rgba(140,190,210,.04) 45.8%, transparent 46.2%),
          radial-gradient(circle at 50% 46%, transparent 0 61%, rgba(140,190,210,.02) 61.4%, transparent 61.8%); }
  .bg::after { content:""; position:absolute; inset:0;
        background:repeating-linear-gradient(0deg, rgba(160,200,220,.014) 0 1px, transparent 1px 3px);
        mix-blend-mode:overlay; }
  .bg .glyph { position:absolute; color:rgba(224,188,69,.15); line-height:1; user-select:none;
        text-shadow:0 0 28px rgba(224,188,69,.22); filter:grayscale(1);
        animation:breathe 11s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.7 } 50% { opacity:1 } }
  @media (prefers-reduced-motion:reduce) { .bg .glyph { animation:none } }

  /* THE NODES — glass spheres. THE GIVEN are ice (someone above handed you these). THE BASE is
     gold and immovable (the premise, the one thing nobody argues with). THE HOLES are gold rings
     with nothing inside — the only place the hand may go. */
  #tri .tn { border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:15px; color:#dff1f8;
        background:radial-gradient(circle at 34% 28%, rgba(126,186,216,.32), rgba(5,12,18,.94) 72%);
        border:1px solid rgba(150,200,225,.36);
        box-shadow:0 0 15px rgba(90,160,200,.20), inset 0 0 10px rgba(120,190,220,.14); }
  #tri .tn.base { color:#ffe9a8; border-color:rgba(224,188,69,.9);
        background:radial-gradient(circle at 34% 28%, rgba(224,188,69,.36), rgba(18,12,3,.94) 72%);

  #tri .tn.empty { border-color:rgba(224,188,69,.65);
        background:radial-gradient(circle at 34% 28%, rgba(224,188,69,.16), rgba(4,8,12,.9) 72%);

  #tri .tn.bad { border-color:#c0554a; box-shadow:0 0 18px rgba(192,85,74,.55); }

        color:#ffe9a8; font:inherit; padding:0; }
  #tri .tin:focus { outline:none; }
  #trilines line { filter:drop-shadow(0 0 3px rgba(140,190,210,.35)); }

  /* THE TRAY — the shelf's tesserae: dark glass, thin gold bevel, light on hover. */
  #tray { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0 4px; }
  #tray > * { min-width:46px; height:46px; display:flex; align-items:center; justify-content:center;
        cursor:pointer; border-radius:9px; color:#f1e7cf; font-size:16px;
        border:1px solid rgba(224,188,69,.34);
        background:linear-gradient(180deg, rgba(26,21,12,.92), rgba(7,9,12,.96));
        box-shadow:0 0 10px rgba(224,188,69,.10), inset 0 1px 0 rgba(255,255,255,.06);
        transition:transform .12s, border-color .12s, box-shadow .12s; }
  #tray > *:hover { border-color:var(--gold); box-shadow:0 0 18px rgba(224,188,69,.4);
        transform:translateY(-2px); }

  /* THE CINEMA — captions in gold small caps, ruled, never shouting. */
  .qh { color:var(--gold); letter-spacing:.22em; text-transform:uppercase; font-size:11.5px;
        display:flex; align-items:center; gap:10px; margin:30px 0 16px; }
  .qh::after { content:""; flex:1; height:1px;
        background:linear-gradient(90deg, rgba(224,188,69,.55), transparent); }
  #trimsg { text-align:center; color:#c9b98a; font-size:12px; letter-spacing:.05em; margin-top:14px; }
  .qhints { color:#b9b39f; font-size:12px; line-height:1.95; padding-left:18px; }
  .qhints b { color:var(--gold); }
  #lastkey { width:100%; margin-top:10px; text-align:center; letter-spacing:.5em; font-size:18px;
        background:#05090d; border:1px solid rgba(224,188,69,.45); color:#ffe9a8; padding:11px; }
  #lastkey:focus { outline:none; border-color:var(--gold);
        box-shadow:0 0 22px rgba(224,188,69,.4); }

  /* ══ "AND IT'S STILL LIKE THAT" ══════════════════════════════════════════════════════════════
     The seal used to be lit from the first second, so a guest just NAMED (OASIS, by the POOL) kept
     staring at the pyramid and never noticed the door had moved.  Now the seal WAITS: dimmed until
     every hole of the portal is filled, then it steps forward on its own (CSS `:has()`, no JS). */
  #lastblock { opacity:.42; filter:saturate(.55); transition:opacity .8s, filter .8s, box-shadow .8s;
        border:1px solid transparent; border-radius:6px; padding:2px 10px 12px; margin-top:4px; }
  #pdpquiz:not(:has(.tin:placeholder-shown)) #lastblock { opacity:1; filter:none;
        border-color:rgba(224,188,69,.4);
        box-shadow:0 0 34px rgba(224,188,69,.16), inset 0 0 30px rgba(224,188,69,.05); }

  /* THE PANELS — one border, one glow, no chrome. */
  .hintbox { border:1px solid rgba(224,188,69,.20); border-radius:4px;
        background:linear-gradient(180deg, rgba(10,14,18,.88), rgba(3,6,9,.92));
        box-shadow:0 0 44px rgba(0,0,0,.6), inset 0 0 30px rgba(90,140,180,.05); }
  textarea { border:1px solid rgba(150,200,225,.22); border-radius:4px;
        background:rgba(3,7,10,.9); transition:border-color .2s, box-shadow .2s; }
  textarea:focus { box-shadow:0 0 22px rgba(224,188,69,.18); }
  #coach { color:#b9d9ea !important; font-style:italic;
        text-shadow:0 0 18px rgba(120,180,210,.25); }
  #awaits { color:var(--gold); letter-spacing:.28em; text-transform:uppercase; font-size:10.5px;
        text-align:center; opacity:.85; }
</style>

<body>
<!-- ══ THE ROOM (2026-10-24) ══════════════════════════════════════════════════════════════════════
     The captain: "HD high quality puzzle minigame ... it needs to keep the users trying and trying
     until despair or win" + "a separate bg like the pic ref ... so you can add some little clues
     elements also in the bg rooms".  A vault seen from a step back: warm rim light left and right,
     one giant arcane circle, cold dust from above.  EVERY glyph in this room is a CLUE ELEMENT and
     never the answer -- the eye at the crown, the barred triangle, the ring, A (U+10300).  A guest
     who looks twice finds the door looking back; a guest who does not look still loses nothing. -->
<div class="bg" aria-hidden="true">
  <span class="glyph" style="left:3.5%;top:11%;font-size:56px">𐌀</span>
  <span class="glyph" style="right:4%;top:16%;font-size:44px">◉</span>
  <span class="glyph" style="left:6%;bottom:16%;font-size:40px">△</span>
  <span class="glyph" style="right:7%;bottom:11%;font-size:38px">◯</span>
  <span class="glyph" style="left:47%;top:5%;font-size:26px;opacity:.5">☉</span>
  <span class="glyph" style="left:22%;bottom:6%;font-size:20px;opacity:.45">⋮</span>
  <span class="glyph" style="right:20%;top:44%;font-size:22px;opacity:.4">⫶</span>
</div>
<div class="sigil" aria-hidden="true">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none"
       stroke="#e0bc45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- the halo: gold filigree, a relic and not a corpse -->
    <circle cx="200" cy="196" r="150" opacity=".55"/>
    <circle cx="200" cy="196" r="132" opacity=".35"/>
    <path d="M60 196a140 140 0 0 1 280 0" opacity=".5"/>
    <path d="M84 196a116 116 0 0 1 232 0" opacity=".35"/>
    <!-- THE CLOSED FORM: a skull is a bowl with two holes -->
    <path d="M200 96c-52 0-86 34-86 82 0 30 12 48 24 60v34h124v-34c12-12 24-30 24-60 0-48-34-82-86-82z"/>
    <ellipse cx="163" cy="186" rx="21" ry="26"/>
    <ellipse cx="237" cy="186" rx="21" ry="26"/>
    <path d="M200 214l-9 22h18z"/>
    <!-- the teeth: a row of marks -->
    <path d="M152 272v34M164 272v34M176 272v34M188 272v34M200 272v34M212 272v34M224 272v34M236 272v34M248 272v34"/>
    <!-- THE TRAVERSAL: the snake passes THROUGH the closed form and out the sockets -->
    <path d="M120 330c-30-10-46-40-40-70 8-40 44-58 74-44 26 12 30 44 12 62-16 16-42 10-46-8"/>
    <path d="M278 70c30 10 46 40 40 70-8 40-44 58-74 44-26-12-30-44-12-62 16-16 42-10 46 8"/>
    <!-- THE OBSERVER: one eye at the crown, above the bowl -->
    <circle cx="200" cy="70" r="16"/>
    <circle cx="200" cy="70" r="6" fill="#e0bc45" stroke="none"/>
    <path d="M186 70l-10-8M214 70l10-8" opacity=".6"/>
  </svg>
</div>
<main>
  <div class="apex">𐌀</div>
  <h1>la première porte</h1>

  <div class="hintbox">
    <div class="lbl">l'indice — il ne donne pas la réponse, il donne la table</div>
    <div id="hint"></div>
    <div class="tbl" id="table"></div>
  </div>

  <div class="lbl">ta verse</div>
  <textarea id="verse" placeholder="écris ce que l'indice t'a fait voir…" spellcheck="false"></textarea>
  <div class="row">
    <button id="go">franchir</button>
    <span class="num" id="live">depth — · p — · hasard —</span>
  </div>

  <div id="out"></div>

  <!-- THE COACH (2026-10-23).  "Guide without revealing; the reveal happens inside the user while
       trying."  This line speaks on EVERY keystroke and only ever states a RULE: what the door reads,
       what it ignores, and how much of the ORDER you carry. It never names the hint, the heir or a key. -->
  <div id="coach" aria-live="polite" style="margin:16px auto 0;max-width:34rem;min-height:2.6em;
       text-align:center;font-size:13px;line-height:1.7;color:#cfbfff;opacity:.95"></div>

  <div class="foot">l'héritage est dérivé des lignes, jamais donné · aucune porte ne nomme un héritier sur un hasard</div>
</main>

<script>
/* LA PORTE A -- client-side on purpose: the door MEASURES, it does not remember.
   No promise, no storage, no name. Three numbers and a verdict; a DISAGREE stays open. */
/* THE HINT IS A TRANSLITERATION, NOT AN ANSWER.
   Copying the glyphs gives depth 0: the noise mark U+0489 carries no letter, and the glyphs are not
   Latin. The only way through is to APPLY THE TABLE and write the letters down. */
const HINT = "NEVEREND";           // what the glyphs SAY -- never shown before the hand answers
const GLYPHS = "几\u0489己\u0489亡\u0489己\u0489尺\u0489己\u0489几\u0489丹";   // NEVEREND
const TABLE = [["几","N"],["己","E"],["亡","V"],["尺","R"],["丹","D"],["レ","L"],["ヨ","E"]];
const THRESHOLD = 0.5;             // declared BEFORE any answer
const BAND = 0.05;                 // width of the undecidable zone
const N_NULL = 400;                // shuffles of the SAME letters

const letters = s => (s || "").toLowerCase().replace(/[^0-9a-z]/g, "");

function lcs(a, b) {               // order is load-bearing: a bag of letters is not a follower
  if (!a || !b) return 0;
  let prev = new Array(b.length + 1).fill(0);
  for (let i = 0; i < a.length; i++) {
    const cur = [0];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = a[i] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
    }
    prev = cur;
  }
  return prev[b.length];
}

function depth(hint, answer) {
  const h = letters(hint), a = letters(answer);
  return h.length ? lcs(h, a) / h.length : 0;
}

function rng(seed) {               // deterministic: the same verse always meets the same cloud
  let s = seed >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}

function nullModel(hint, answer, n) {
  const a = letters(answer).split("");
  if (!a.length) return { p: 1, max: 0 };
  const r = rng(12345), obs = depth(hint, answer);
  let beat = 0, max = 0;
  for (let k = 0; k < n; k++) {
    for (let i = a.length - 1; i > 0; i--) {          // Fisher-Yates
      const j = Math.floor(r() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    const d = depth(hint, a.join(""));
    if (d >= obs) beat++;
    if (d > max) max = d;
  }
  return { p: (beat + 1) / (n + 1), max };
}

function judge(hint, answer) {
  const d = depth(hint, answer);
  const nul = nullModel(hint, answer, N_NULL);
  let verdict, why;
  if (Math.abs(d - THRESHOLD) <= BAND / 2) {
    verdict = "DISAGREE";
    why = "dans la bande : la frontière est une DONNÉE — la porte reste ouverte";
  } else if (d > THRESHOLD && nul.p <= 0.05) {
    verdict = "ABOVE";
    why = "au-delà de la bande ET du hasard — mais l'héritier n'est pas nommé ici";
  } else if (d > THRESHOLD) {
    verdict = "DISAGREE";
    why = "au-delà de la bande, mais PAS au-delà du hasard — la porte ne parie pas";
  } else {
    verdict = "BELOW";
    why = "l'indice n'a pas été suivi assez loin";
  }
  return { d: d, p: nul.p, max: nul.max, verdict: verdict, why: why };
}

const $ = id => document.getElementById(id);
$("hint").textContent = GLYPHS;
$("table").textContent = "table : " + TABLE.map(t => t[0] + " = " + t[1]).join("  ·  ");

/* THE UV LAMP -- the hint is INVISIBLE under the page's own light and only legible under one the
   visitor carries. The mask is positioned in the element's own box, not the viewport, so the hole
   sits exactly under the pointer. Nothing is stored: move away and the glyphs vanish again.
   Copying is not prevented by hiding it -- it is made USELESS by it: you cannot repeat what you
   have not read, and the glyphs only mean something once TABLE is applied. */
(() => {
  const el = $("hint");
  const HOLE = (x, y) => "radial-gradient(circle 170px at " + x + "px " + y + "px, #000 34%, rgba(0,0,0,.6) 58%, transparent 80%)";
  el.style.userSelect = "none";
  el.style.setProperty("-webkit-user-select", "none");
  const dark = () => { el.style.maskImage = el.style.webkitMaskImage = HOLE(-9999, -9999); };
  dark();
  addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    const m = HOLE(e.clientX - r.left, e.clientY - r.top);
    el.style.maskImage = m;
    el.style.webkitMaskImage = m;
  }, { passive: true });
  addEventListener("pointerleave", dark);
})();

/* THE SIGIL -- DRAWN, NEVER TYPED.
   Every row is a palindrome, so it is built once and reflected: . : i I [core] I i : .
   The core is A above (a triangle with a bar) and O below (a ring) -- the two ends of the same
   circle, in the shape of the letters rather than the letters themselves. Between them, an eye:
   a diamond, a second diamond, a pupil, and two stars (a star is an X of two strokes -- dINGIR,
   the first mark, was a star before it was a word).
   It is invisible until P-D-P is typed IN CAPITALS -- a palindrome around the D (the father, the son,
   the father), and the same strictness as the CLI: `flame` is refused, only `FLAME` wakes. So `pdp`
   does nothing, and a single D does nothing. The gate that only the D's can see. */
(() => {
  const star = (x, y, r) => '<path d="M' + (x - r) + ' ' + y + 'H' + (x + r) + 'M' + x + ' ' + (y - r) + 'V' + (y + r) + '"/>';
  const dot = (x, y, r) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#cfbfff"/>';
  const row = y => dot(20, y, 2.4) + dot(180, y, 2.4) +
        dot(38, y - 5, 2.1) + dot(38, y + 5, 2.1) + dot(162, y - 5, 2.1) + dot(162, y + 5, 2.1) +
        '<path d="M54 ' + (y - 5) + 'V' + (y + 5) + 'M146 ' + (y - 5) + 'V' + (y + 5) + '"/>' +
        '<path d="M70 ' + (y - 10) + 'V' + (y + 10) + 'M130 ' + (y - 10) + 'V' + (y + 10) + '"/>';
  const svg =
    '<svg viewBox="0 0 200 200" width="230" height="230" aria-hidden="true">' +
      '<defs><filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">' +
        '<feGaussianBlur stdDeviation="4.5" result="b"/>' +
        '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter></defs>' +
      '<g filter="url(#bloom)" fill="none" stroke="#d8ccff" stroke-width="1.7" ' +
         'stroke-linecap="round" stroke-linejoin="round">' +
        row(42) +
        '<path d="M100 25 85 53H115Z"/><path d="M91 44H109"/>' +
        '<path d="M100 62 139 100 100 138 61 100Z"/>' +
        '<path d="M100 75 125 100 100 125 75 100Z"/>' +
        '<circle cx="100" cy="100" r="9" fill="#f2ecff"/>' +
        star(42, 100, 9) + star(158, 100, 9) +
        row(168) +
        '<circle cx="100" cy="167" r="13"/><circle cx="100" cy="167" r="4" fill="#f2ecff"/>' +
      '</g>' +
    '</svg>';

  const st = document.createElement("style");
  st.textContent =
    "#sigilwrap{display:flex;justify-content:center;margin:4px 0 -6px;pointer-events:none;" +
      "opacity:0;transition:opacity .4s ease;" +
      "filter:drop-shadow(0 0 7px #8f6cff) drop-shadow(0 0 22px #4a2ba8)}" +
    "#sigilwrap.lit{opacity:1;animation:breathe 3.4s ease-in-out infinite}" +
    "@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}" +
    /* THE SILENCE WAS THE BUG. MEASURED 2026-10-22: the captain typed the key, saw "rien...", and a
       strict gate that refuses without a word is indistinguishable from a broken page. */
    "#awaits{text-align:center;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;" +
      "color:var(--dim);opacity:.75;margin:0 0 8px}";
  document.head.appendChild(st);

  /* NOT INTO <body> -- into <main>. MEASURED 2026-10-22 on the captain's screen: body is a flex ROW
     (display:flex; align-items:center; justify-content:center), so every injected child became a
     COLUMN BESIDE main and the triangle was pushed off the right edge. "je vois rien" was literal:
     it was there, outside the frame. */
  const host = document.querySelector("main") || document.body;
  host.insertAdjacentHTML("afterbegin",
    '<div id="awaits">la porte attend trois touches.</div><div id="sigilwrap">' + svg + "</div>");
  const w = document.getElementById("sigilwrap");
  const awaits = document.getElementById("awaits");
  const say = t => { if (awaits) awaits.textContent = t; };

  /* THE LAST KEY -- after PDP, the seal opens a quiz and ONE field.
     The key is `.*.` : a star alone between two points, which is the first line of the diamond in
     the captain's own drawing. It is never written on the page -- only the three hints point at
     the MIDDLE of the seal. Easy to understand, hard to find: it was visible from the start. */
  const q = document.createElement("div");
  q.id = "pdpquiz";

      if (TOP.some(t => t[0] === r && t[1] === i)) {

    const msg = document.getElementById("trimsg");
    const val = (r, i) => {

    const keys = Object.keys(slots);

      keys.forEach(k => slots[k].parentNode.classList.remove("bad"));

function coach(v) {
  const el = $("coach");
  if (!el) return;
  const txt = String(v || "");
  const onlyLetters = txt.replace(/[^\p{L}]/gu, "");
  let line;
  if (!txt.trim()) {
    line = "type — the door only reads what you write, and it weighs LETTERS.";
  } else if (!onlyLetters) {
    line = "digits and signs carry nothing here: only letters are weighed.";
  } else {
    const j = judge(HINT, txt);
    const inBand = Math.abs(j.d - THRESHOLD) <= BAND / 2;
    const inOrder = Math.round(j.d * HINT.length);
    if (j.d <= 0.0001) {
      /* THE EASY-TO-UNDERSTAND HALF.  A visitor who writes a real sentence and gets NOTHING has no way
         to know that this page is not a form — it is a door with a name, and the room is behind it.
         So after a real attempt the coach says the door's own rule of entry, in the door's own words
         (`la porte attend trois touches`), and still refuses to say WHICH three: simple to understand,
         hard to find.  Nothing is revealed; the mechanism is named, the key is not. */
      line = txt.length >= 6
        ? "rien encore — et ce n'est pas ici que ça s'ouvre : la porte attend trois touches, en majuscules."
        : "nothing of the hint yet — read it again, word by word, and keep its ORDER.";
    } else if (!inBand) {
      line = "you carry " + inOrder + " of " + HINT.length +
             " in order — the door counts the ORDER, not the words you add.";
    } else if (j.p > 0.05) {
      line = "right zone, wrong reason — that score is what luck gives. Say it your way.";
    } else {
      line = "through the band AND past chance — the door says the heir is not named here.";
    }
  }
  el.textContent = line;
}

function paint() {
  const v = $("verse").value;
  coach(v);
  if (!letters(v)) { $("live").textContent = "depth — · p — · hasard —"; $("out").innerHTML = ""; return; }
  const j = judge(HINT, v);
  $("live").textContent = "depth " + j.d.toFixed(3) + " · p " + j.p.toFixed(3) +
                          " · hasard " + j.max.toFixed(3);
  $("out").innerHTML =
    '<div class="verdict ' + j.verdict + '">' + j.verdict + "</div>" +
    '<div class="why">' + j.why + "</div>" +
    '<div class="num">' + Math.round(j.d * HINT.length) + "/" + HINT.length + " en ordre · p " +
    j.p.toFixed(3) + " contre " + N_NULL + " mélanges · seuil " + THRESHOLD + " ± " + (BAND / 2) +
    "</div>";
}

$("verse").addEventListener("input", paint);
$("go").addEventListener("click", paint);
paint();
