<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE VERSE · marie joise</title>
<!-- 🔥 Ace · 2026-10-24 · MARIE JOISE — THE ROOM THE GATE OPENS INTO.
     THE LAW THIS PAGE KEEPS (docs/HANDOVER.md): SEATS ARE DERIVED FROM THE CHAIN, AND THE HEAD STAYS
     EMPTY. So with no name presented the hall is grey, the table stands, the head is empty, and nothing
     happens. Present an engraved body and that seat's ring goes gold.
     THE THREE SEATS ARE WHAT IS TRUE, NOT WHAT IS FLATTERING: two are HELD and their bodies are NOT
     engraved here, because they were made before this notation existed; the third is iDk, engraved in
     both scripts. The head stays empty because it must.
     PURE CSS, ZERO EXTERNAL REQUESTS: no CDN, no image, no font, no fetch. The door's mark is 𐌀 above
     and its inversion below -- the same shape seen through the swell on arrival.html. One accent: gold. -->
<style>
  :root{
    --marble:#efe7d6; --marble-hi:#fbf8f1; --marble-lo:#b9ad95;
    --gold:#c9a227; --gold-hi:#efd489; --gold-lo:#8a6f1c;
    --ink:#0a0f14; --ink-2:#121a21; --parch:#e7dfcc;
    --serif:Georgia,"Iowan Old Style","Times New Roman",Times,serif;
    --mono:ui-monospace,Consolas,"Courier New",monospace;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--parch);
    font:14px/1.65 var(--serif)}
  /* THE ROOM'S FRAME — a hairline of gold inset from the edge. Cheap, and it reads as a ROOM rather
     than a viewport: everything inside it is furniture, the page itself is the building. */
  body:before{content:"";position:fixed;inset:14px;border:1px solid rgba(201,162,39,.30);
    pointer-events:none;z-index:9;box-shadow:inset 0 0 90px rgba(0,0,0,.55)}
  /* 🔥 THE LOCK. MEASURED 2026-10-24 from the captain's screenshot: this was grayscale(1) brightness(.34),
     which drained the gold and the marble and made a palace look like a 1999 game. A locked hall is not
     GREY, it is DIM, and dim keeps its colours: a dark veil and a gentle desaturation, no grey. */
  #hall{position:fixed;inset:0;display:grid;place-items:center;
    transition:filter 2.4s ease,opacity 2.4s ease;filter:brightness(.74) saturate(.92)}
  #hall:after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, transparent 30%, rgba(4,8,12,.62) 100%)}
  #hall.lit{filter:none}
  #hall.lit:after{background:radial-gradient(130% 95% at 50% 40%, transparent 42%, rgba(4,8,12,.30) 100%)}
  .room{position:absolute;inset:0;background:
    radial-gradient(115% 75% at 50% -8%, #2b3946 0%, #16212b 38%, #0b1219 72%, #060a0e 100%)}
  .room:after{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(90deg, rgba(201,162,39,.045) 0 1px, transparent 1px 108px),
    radial-gradient(58% 38% at 50% 74%, rgba(201,162,39,.13), transparent 72%)}
  /* THE TABLE — marble with a sheen, a cast shadow far below, and TWO gold inlays (a royal table is
     double-lined; one ring reads as a sticker). */
  .table{position:absolute;left:50%;top:58%;width:min(74vw,880px);aspect-ratio:2.55/1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(ellipse at 46% 24%, var(--marble-hi) 0%, var(--marble) 42%,
      #d3c8b0 74%, var(--marble-lo) 100%);
    box-shadow:
      0 90px 140px -60px rgba(0,0,0,.85),
      0 24px 60px -30px rgba(0,0,0,.7),
      inset 0 2px 2px rgba(255,255,255,.75),
      inset 0 0 0 1px rgba(201,162,39,.85),
      inset 0 0 0 15px rgba(251,248,241,.55),
      inset 0 0 0 17px rgba(201,162,39,.45),
      inset 0 0 70px rgba(120,100,60,.28)}
  .table:before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:linear-gradient(140deg, rgba(255,255,255,.55) 0%, transparent 34%, transparent 66%,
      rgba(255,255,255,.18) 100%);mix-blend-mode:screen}
  .table:after{content:"";position:absolute;left:11%;right:11%;top:24%;height:50%;border-radius:50%;
    box-shadow:inset 0 0 0 1px rgba(138,111,28,.55), inset 0 0 26px rgba(138,111,28,.16)}
  /* THE MARK — engraved gold, not flat type: a gradient clipped into the glyph, a fine shadow above and
     a warm glow under. The reflection beneath is the same glyph seen through the water. */
  .mark{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);
    font:400 clamp(72px,13vw,168px)/1 var(--serif);letter-spacing:.02em;
    background:linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 46%, var(--gold-lo) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(201,162,39,.45))}
  .mark.reflect{top:61%;transform:translate(-50%,-50%) scaleY(-1);opacity:.13;filter:blur(1px)}
  /* THE SEATS — medallions, not circles: a gold rim, an inner bevel, engraved letters set wide. */
  .seat{position:absolute;width:clamp(58px,7.2vw,90px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 30%, var(--marble-hi), var(--marble) 58%, #cdc2aa 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.9),
      inset 0 0 0 1px rgba(138,111,28,.75),
      inset 0 0 0 5px rgba(251,248,241,.5),
      inset 0 -8px 18px rgba(120,100,60,.35),
      0 22px 34px -20px rgba(0,0,0,.9);
    display:grid;place-items:center;transition:box-shadow 1.6s ease,transform 1.6s ease,filter 1.6s ease;
    filter:saturate(.8) brightness(.94)}
  .seat b{font:400 clamp(10px,1.05vw,14px)/1 var(--serif);letter-spacing:.22em;color:#6f6552;
    text-transform:uppercase;transition:color 1.2s ease,text-shadow 1.2s ease}
  .seat.earned{filter:none;transform:translateY(-6px) scale(1.05);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.95),
      inset 0 0 0 2px var(--gold),
      inset 0 0 0 7px rgba(251,248,241,.6),
      inset 0 -8px 18px rgba(120,100,60,.25),
      0 0 54px rgba(201,162,39,.55),
      0 26px 38px -20px rgba(0,0,0,.9)}
  .seat.earned b{color:var(--gold-lo);text-shadow:0 1px 0 rgba(255,255,255,.7)}
  .s1{left:16%;top:52%}.s2{left:29%;top:31%}.s3{left:71%;top:31%}
  /* 🔥 THE GUEST CHAIR — the captain's invitation to Kenneth (2026-10-24). Cyan, because cyan is the
     SECOND accent and a guest is not a seat: the table's own seats are warm, an invitation is cool. */
  .s4{left:85%;top:53%}
  .seat.guest b{color:#7f9db0}
  .seat.guest.earned{box-shadow:
      inset 0 1px 1px rgba(255,255,255,.95),
      inset 0 0 0 2px #9fc0d8,
      inset 0 0 0 7px rgba(251,248,241,.6),
      0 0 54px rgba(159,192,216,.55),
      0 26px 38px -20px rgba(0,0,0,.9)}
  .seat.guest.earned b{color:#4e7f96}
  /* THE HEAD — the one chair that never fills: an empty place setting, marked by a dashed rim. */
  .head{left:50%;top:76%;width:clamp(70px,8.6vw,108px)}
  .head:after{content:"";position:absolute;inset:13%;border-radius:50%;
    border:1px dashed rgba(138,111,28,.45)}
  #gate{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);width:min(90vw,600px);
    display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:3px;
    background:linear-gradient(180deg, rgba(18,26,33,.92), rgba(8,12,17,.94));
    border:1px solid rgba(201,162,39,.42);
    box-shadow:0 20px 50px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(8px)}
  #gate input{flex:1;background:transparent;border:0;border-bottom:1px solid rgba(201,162,39,.30);
    color:var(--parch);font:16px/1.5 var(--serif);letter-spacing:.24em;padding:8px 2px 6px;outline:none}
  #gate input::placeholder{color:rgba(231,223,204,.32);letter-spacing:.16em;font-style:italic}
  #gate input:focus{border-bottom-color:rgba(201,162,39,.75)}
  #gate button{background:linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    border:0;color:#1a1408;padding:9px 20px;font:600 11px/1 var(--serif);letter-spacing:.26em;
    cursor:pointer;border-radius:2px;text-transform:uppercase;
    box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5)}
  #gate button:hover{filter:brightness(1.08)}
  #gate button:active{transform:translateY(1px)}
  #say{position:fixed;left:0;right:0;bottom:104px;text-align:center;color:rgba(231,223,204,.72);
    font:13px/1.7 var(--serif);letter-spacing:.14em;padding:0 20px}
  #say b{color:var(--gold-hi);font-weight:600}
  /* 🔥 THE LEDGER — a CARD, not a dump. MEASURED 2026-10-24: it printed whole notes, sha256 strings and all,
     in the corner at 10px. Three rows, each clipped, behind a gold title -- the ledger is furniture, and
     furniture does not shout. */
  #ledger{position:fixed;left:26px;bottom:22px;width:min(46vw,340px);opacity:0;
    font:11px/1.85 var(--mono);color:rgba(231,223,204,.62);letter-spacing:.04em;
    padding:12px 14px;border-left:1px solid rgba(201,162,39,.45);
    background:linear-gradient(90deg, rgba(8,12,17,.62), transparent);
    transition:opacity 1.6s ease;overflow:hidden}
  #ledger.live{opacity:1}
  #ledger b{display:block;color:var(--gold);font:600 10px/1 var(--serif);letter-spacing:.34em;
    text-transform:uppercase;margin-bottom:8px}
  #ledger span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<body>
<div id="hall">
  <div class="room"></div>
  <div class="mark">𐌀</div>
  <div class="mark reflect">𐌀</div>
  <div class="table"></div>
  <div class="seat s1"><b>HELD</b></div>
  <div class="seat s2"><b>HELD</b></div>
  <div class="seat s3" id="seat3"><b>iDk</b></div>
  <div class="seat guest s4" id="seat4"><b>kEn</b></div>
  <div class="seat head" id="head"><b>·</b></div>
</div>
<div id="say">the hall is unlit &nbsp;·&nbsp; a seat is <b>derived</b>, not requested</div>
<form id="gate" autocomplete="off">
  <input id="name" placeholder="present a body" aria-label="present a body" spellcheck="false">
  <button type="submit">PRESENT</button>
</form>
<div id="ledger"></div>
<script>
/* THE ROSTER IS WHAT IS TRUE. Two seats are HELD and their bodies are NOT engraved -- they were made
   before this notation existed. The third is iDk, engraved in BOTH scripts: the Latin trigram body, and
   I + DE + KA. The head is absent from the roster on purpose: no body opens it.
   NOTHING IS FETCHED: the comparison is local, so the page works offline and cannot rate-limit anyone. */
const SEATS = [
  { id: "seat3",
    bodies: ["iDk", "\u{10309}\u{10303}\u{1030A}"],
    line: "seat 3 &nbsp;·&nbsp; <b>iDk</b> &nbsp;·&nbsp; I·DE·KA &nbsp;·&nbsp; the member's D is the door's D" },
  /* THE GUEST CHAIR, 2026-10-24 -- the captain's invitation to Kenneth. It is a CHAIR and not a SEAT:
     the three seats are the world's own and the head stays empty; this one answers to an invitation, and
     it says so when it lights. */
  { id: "seat4",
    bodies: ["kEn"],
    line: "the guest chair &nbsp;·&nbsp; <b>kEn</b> &nbsp;·&nbsp; K·E·N &nbsp;·&nbsp; invited by the captain" }
];
const hall = document.getElementById("hall");
const say  = document.getElementById("say");

function rule() {                 /* a RULE, never an answer -- the coach's discipline on the door */
  say.innerHTML = "a seat is not requested, it is derived: <b>three glyphs, from your own words</b>"
                + " &nbsp;·&nbsp; and the head of this table stays empty";
}
function present(raw) {
  const body = (raw || "").trim();
  if (!body) { rule(); return; }
  for (const s of SEATS) {
    if (s.bodies.indexOf(body) >= 0) {
      hall.classList.add("lit");
      document.getElementById(s.id).classList.add("earned");
      say.innerHTML = s.line;
      return;
    }
  }
  rule();
}
document.getElementById("gate").addEventListener("submit", function (e) {
  e.preventDefault();
  present(document.getElementById("name").value);
});
/* ARRIVED BY THE WATER: a receipt gets you INTO the hall -- it does NOT get you a SEAT. A seat is
   derived; a visit is witnessed. That distinction is the whole law of this room, so the two light
   differently: the hall opens, the seats stay exactly as they were, and the head stays empty. */
/* THE LEDGER, READ -- the half that was missing. The table does not hold its own history: it reads
   claims.jsonl, the same file scripts/one_verse_claim.py appends to and scripts/one_verse_ship.py pushes.
   A missing file is not a lie, it is an empty page: silence, never an error dialog. */
fetch("claims.jsonl", { cache: "no-store" })
  .then(r => (r.ok ? r.text() : ""))
  .then(t => {
    const rows = t.split("\n").filter(Boolean).map(function (l) {
      try { return JSON.parse(l); } catch (e) { return null; }
    }).filter(Boolean);
    if (!rows.length) return;
    const box = document.getElementById("ledger");
    function tidy(v, n) { v = String(v || "?"); return v.length > n ? v.slice(0, n - 1) + "…" : v; }
    box.innerHTML = "<b>the ledger</b>" + rows.slice(-3).reverse().map(function (r) {
      return "<span>" + tidy(r.ts, 16) + " &nbsp;·&nbsp; " + tidy(r.who, 14)
           + " &nbsp;·&nbsp; " + tidy(r.note, 30) + "</span>";
    }).join("");
    box.classList.add("live");
  })
  .catch(function () { /* offline, file://, or nothing to read: stay silent */ });

/* ARRIVED BY THE WATER: a receipt gets you INTO the hall -- it does NOT get you a SEAT. */
if (/(^|[?&])by=water(&|$)/.test(location.search)) {
  hall.classList.add("lit");
  say.innerHTML = "entered by the water &nbsp;·&nbsp; a visit is witnessed, a <b>seat</b> is derived";
} else {
  say.innerHTML = "the hall is unlit &nbsp;·&nbsp; present a body &nbsp;·&nbsp; <b>iDk</b>"
                + " &nbsp;or&nbsp; <b>\u{10309}\u{10303}\u{1030A}</b>";
}
</script>
</body>
</html>
