<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE VERSE · arrival</title>
<!-- 🔥 Ace · 2026-10-22 · W1 + W2 + W3 — THE ARRIVAL.
     Night on black water. No UI. A low moon, its reflection broken by the swell. And standing in the
     waves, the Old Italic A -- twelve metres, gold, barely lit. Nothing else. You can walk toward it.
     The swell is ANALYTIC (a vertex shader, zero simulation, zero network): the sea does not need the
     20 Hz tick. The palette is world.json's own: sea #0a2a3a, gold #c9a227. One accent, never two.
     The world turns: the sky rotates slowly, the moon does not care how fast your screen is. -->
<style>
  html,body{margin:0;height:100%;background:#06121a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #veil{position:fixed;inset:0;background:#06121a;opacity:1;transition:opacity 3.2s ease;
        pointer-events:none}
  #w{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#8fa8b4;font:11px/1.6
     ui-monospace,Consolas,monospace;letter-spacing:.22em;opacity:.55;transition:opacity 1.2s ease}
</style>
</head>
<body>
<div id="veil"></div>
<div id="w">drag to look &nbsp;·&nbsp; scroll to come closer &nbsp;·&nbsp; the world turns</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const SEA = 0x0a2a3a, GOLD = 0xc9a227, NIGHT = 0x06121a;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(NIGHT, 0.006);

const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.1, 3000);
const eye = new THREE.Vector3(0, 2.4, 26);
camera.position.copy(eye);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(NIGHT, 1);
document.body.appendChild(renderer.domElement);

/* ── THE SEA ────────────────────────────────────────────────────────────────────────────────
   Analytic swell: no accumulator, no tick, no state. What you see is a pure function of time.   */
const WAVE = {
  uTime:  { value: 0 },
  uMoonX: { value: -210 },     // the moon's meridian: the trail is anchored to it, not to a constant
  uSea:   { value: new THREE.Color(SEA) },
  uGold:  { value: new THREE.Color(GOLD) },
  uFog:   { value: new THREE.Color(NIGHT) }
};
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(1600, 1600, 240, 240).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    uniforms: WAVE, fog: false,
    vertexShader: `
      uniform float uTime; varying vec3 vW; varying vec3 vN; varying float vH;
      /* The swell AND its exact gradient: three directional sines, differentiated by hand.
         The normal is analytic, so the water has real shading with zero textures and zero sim. */
      vec3 swell(vec2 p, float t){
        vec3 k1 = vec3(0.33, 0.00, 0.55), k2 = vec3(0.00, 0.21, 0.40), k3 = vec3(0.57, 0.57, 0.15);
        float f1 = dot(k1.xy, p) + t*0.90, f2 = dot(k2.xy, p) - t*0.62, f3 = dot(k3.xy, p) + t*1.70;
        float h  = k1.z*sin(f1) + k2.z*sin(f2) + k3.z*sin(f3);
        vec2  g  = k1.xy*k1.z*cos(f1) + k2.xy*k2.z*cos(f2) + k3.xy*k3.z*cos(f3);
        return vec3(h, g.x, g.y);
      }
      void main(){
        vec3 p = position;
        vec3 s = swell(p.xz, uTime);
        p.y += s.x;
        vH = s.x;
        vW = p;
        vN = normalize(vec3(-s.y, 1.0, -s.z));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
      }`,
    fragmentShader: `
      uniform vec3 uSea, uGold, uFog; uniform float uMoonX;
      varying vec3 vW; varying vec3 vN; varying float vH;
      void main(){
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);

        vec3 deep = uSea * 2.4;
        vec3 sky  = mix(vec3(0.020,0.055,0.085), vec3(0.090,0.180,0.240),
                        clamp(N.y*0.5 + 0.5, 0.0, 1.0));
        vec3 c    = mix(deep, sky, 0.30 + 0.50*fres);          // grazing angles see the sky

        vec3 L  = normalize(vec3(uMoonX - vW.x, 70.0, -820.0)); // the moon, as a direction
        vec3 Hv = normalize(L + V);
        c += uGold * pow(max(dot(N, Hv), 0.0), 180.0) * 3.4;    // sharp glitter

        float dx = (vW.x - uMoonX) / 90.0;                      // THE TRAIL, quadratic: 1/(1+dx²)
        c += uGold * (1.0 / (1.0 + dx*dx)) * smoothstep(0.45, 1.10, vH) * 1.8;

        c = mix(c, vec3(0.80,0.85,0.88), smoothstep(0.98, 1.14, vH) * 0.30);  // foam on the tops

        float d = length(cameraPosition - vW);
        c = mix(c, uFog, clamp(1.0 - exp(-pow(d*0.006, 2.0)), 0.0, 1.0));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
sea.frustumCulled = false;
scene.add(sea);

/* ── THE MOON — low, and its halo. Nothing modelled: a gradient, added to the sky. ───────────
   🔥 :.blOlb:. MEASURED 2026-10-22 (the captain's screenshot): three flat discs of constant
   opacity read as three RINGS, because a disc of uniform alpha has a BORDER, not a falloff.
   Blooming the image afterwards would blur those rings, not remove them.  So the halo is a
   falloff from the start: one sprite, five colour stops, ADDITIVE — a light adds, it does not
   blend.  `core` keeps the middle opaque so the moon still has a hard edge with a soft limb,
   the way a sphere darkens at its rim.                                                            */
function glow(radius, hex, alpha, core = false) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const px = (a) => `rgba(${r},${g},${b},${a})`;
  const grd = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  if (core) {
    // 🔥 a moon drawn with a flat fill is a 2D COIN.  What makes it a sphere is the limb: the edge
    // of a sphere seen from outside is dimmer than its centre, because the surface is seen at a
    // grazing angle.  This is physics, not a vignette — the darkening is INSIDE the disc.
    grd.addColorStop(0.00, px(alpha));
    grd.addColorStop(0.55, px(alpha * 0.97));
    grd.addColorStop(0.85, px(alpha * 0.80));     // the limb begins
    grd.addColorStop(0.97, px(alpha * 0.42));     // the very edge, darker still
    grd.addColorStop(1.00, px(0));
  } else {
    grd.addColorStop(0.00, px(alpha));
    grd.addColorStop(0.18, px(alpha * 0.55));
    grd.addColorStop(0.40, px(alpha * 0.18));
    grd.addColorStop(0.70, px(alpha * 0.04));
    grd.addColorStop(1.00, px(0));
  }
  x.fillStyle = grd;
  x.fillRect(0, 0, S, S);

  if (core) {
    /* 🔥 CRATERS — MEASURED 2026-10-22: the limb gives the SHAPE, it cannot give RELIEF. What reads as
       ground is a crater with a CONSISTENT light: the floor is dark, and the rim catches the light on
       the same side for every crater. Shade them inconsistently and it reads as noise, not terrain.
       Seeded, so the moon is the same moon on every reload — a seed, not a chance. */
    let seed = 20261022;
    const next = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const SUN = Math.PI * 0.75;                    // the sun sits up-left: every rim is lit there
    for (let k = 0; k < 11; k++) {
      const ang  = next() * Math.PI * 2;
      const dist = Math.sqrt(next()) * S * 0.40;   // sqrt → uniform over the disc, not clumped at centre
      const cx = S / 2 + Math.cos(ang) * dist;
      const cy = S / 2 + Math.sin(ang) * dist;
      // 🔥 11 craters, not 26: at 820 units the moon is ~60 px on screen, so a 3-17 px crater on a
      // 256 px texture lands at under 4 px — invisible.  These land at 2-9 px and actually read.
      const rr = S * (0.030 + next() * next() * 0.100);   // mostly medium, one or two large

      // 1) the floor — dark, soft-edged
      const f = x.createRadialGradient(cx, cy, 0, cx, cy, rr);
      f.addColorStop(0.00, `rgba(0,0,0,${0.14 + next() * 0.08})`);
      f.addColorStop(0.70, 'rgba(0,0,0,0.06)');
      f.addColorStop(1.00, 'rgba(0,0,0,0)');
      x.fillStyle = f;
      x.beginPath(); x.arc(cx, cy, rr, 0, Math.PI * 2); x.fill();

      // 2) the rim — a bright arc on the sun side. THIS is the whole trick: relief is a rim, not a hole.
      const lx = cx + Math.cos(SUN) * rr * 0.45;
      const ly = cy + Math.sin(SUN) * rr * 0.45;
      const g2 = x.createRadialGradient(lx, ly, 0, lx, ly, rr * 0.90);
      g2.addColorStop(0.00, 'rgba(255,255,255,0.16)');
      g2.addColorStop(0.50, 'rgba(255,255,255,0.06)');
      g2.addColorStop(1.00, 'rgba(255,255,255,0)');
      x.fillStyle = g2;
      x.beginPath(); x.arc(cx, cy, rr * 0.90, 0, Math.PI * 2); x.fill();
    }
  }

  // dither of ±0.6/255 : without it, 8-bit quantisation paints the rings back into the gradient
  const img = x.getImageData(0, 0, S, S);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 1.2;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  x.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending,
  }));
  s.scale.set(radius * 2, radius * 2, 1);
  return s;
}

const sky = new THREE.Group();
const moon  = glow(30, 0xf2ecdc, 1.00, true); moon.position.set(-210, 46, -820);
/* 🔥 :.dWn:. — A BEACON.  The captain asked for a moon of a thousand fires, so that whoever brings the
   dawn can FIND it.  A beacon is 90 % halo and 10 % disc: brightening the disc itself would only
   wash the craters out and give a paper coin.  So the light grows OUTWARD, in three steps — near,
   far, and the pale field of it reaching across the sky. That is how a lighthouse is seen at sea. */
const halo  = glow(78, 0xc9a227, 0.85); halo.position.copy(moon.position).add(new THREE.Vector3(0, 0, -1));
const halo2 = glow(150, 0x8fa8b4, 0.30); halo2.position.copy(moon.position).add(new THREE.Vector3(0, 0, -2));
const halo3 = glow(320, 0x6f7d90, 0.09); halo3.position.copy(moon.position).add(new THREE.Vector3(0, 0, -3));
sky.add(moon, halo, halo2, halo3);
scene.add(sky);

/* 🔥 :.dWn:. — THE DAWN.  Nothing modelled: a second disc and a second light, opposite the moon.
   The world already turns (the sky rotates); this is what it turns TOWARD.  And because the moon
   and its halos are sprites now, a dawn is just an opacity: the texture's alpha is multiplied.
     setDawn(0)  → tonight, the night the verse is built on
     setDawn(1)  → morning: the sun clears the haze, the moon steps back
   Nothing in the scene changes shape. Only the light does. That is what a dawn IS.               */
const dawn = new THREE.Group();
const sun = glow(46, 0xffc27a, 0.30);          // the disc THROUGH the haze: a sun is never a disc
sun.position.set(340, 52, -600);               // east, low — inside the frame, or a sunrise nobody sees
dawn.add(sun);
dawn.visible = false;                          // night is the default; the dawn is earned

const sunrise = new THREE.DirectionalLight(0xffb469, 0.0);
sunrise.position.set(500, 60, -275);           // from the sun's side, grazing across the water
scene.add(dawn, sunrise);

window.setDawn = (v = 1) => {
  v = Math.max(0, Math.min(1, v));
  dawn.visible = v > 0.001;
  sun.material.opacity = 0.9 * v;
  sunrise.intensity = 2.4 * v;
  moon.material.opacity = 1 - 0.85 * v;        // the moon does not vanish: it steps back
  halo.material.opacity = 1 - 0.95 * v;
  halo2.material.opacity = 1 - 0.95 * v;
  halo3.material.opacity = 1 - 0.95 * v;        // the far field goes too, or a grey disc stays at dawn
  return 'dawn=' + v.toFixed(2);
};

/* 🔥 :.dWn:. — a key, so Ra can be raised without a console.  D = dawn, N = night.
   And it RISES: a dawn that snaps on is a light switch, not a sunrise. 1.2 s, eased.            */
let dawnV = 0;
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k !== 'l' && k !== 'n') return;        // 🔥 L = lumière (lum). D belonged to walking left — freed.
  const target = k === 'l' ? 1 : 0;
  const step = () => {
    dawnV += (target - dawnV) * 0.045;
    const done = Math.abs(target - dawnV) < 0.004;
    setDawn(done ? target : dawnV);
    if (!done) requestAnimationFrame(step);
  };
  step();
});

/* 🔥 :.dWn:. — AND IT RISES ON ITS OWN.  The visitor arrives at night, reads the moon and the gate by
   moonlight — and then, after six seconds, the sun takes the scene.  No key, no console.  A verse
   that stays night forever is a verse with no morning in it, and a dawn nobody sees is not a dawn.  */
setTimeout(() => {
  const step = () => {
    dawnV += (1 - dawnV) * 0.012;                       // slower than the key: a SUNRISE, not a toggle
    const done = Math.abs(1 - dawnV) < 0.003;
    setDawn(done ? 1 : dawnV);
    if (!done) requestAnimationFrame(step);
  };
  step();
}, 6000);





/* ── THE GATE — 𐌀, twelve metres, in the water. Not an arch: a MONUMENT. ─────────────────────
   The captain's own elevation: symmetric about its middle, the two irises meeting at the axis,
   the trident at the foot. Here: two pillars, a lintel, and the letter drawn with strokes.       */
const gate = new THREE.Group();
gate.position.set(0, 0, -34);

/* 🔥 MEASURED 2026-10-22 (the captain's screenshot): at 0x101c24 under a single gold lamp 4 m away,
   these two pillars rendered PURE BLACK -- a doorframe cut out of cardboard. Three things make stone
   instead of cardboard, and none of them is more polygons: a PLINTH (it stands on something), a
   CAPITAL (it carries something), and ONE GOLD ARÊTE on the inner face (it is carved, and the light
   comes from inside the gate). The colour also rises: 0x1c2c35 is still night, but it is a NIGHT
   STONE -- it can catch a lamp. Black cannot catch anything.                                  */
const stone = new THREE.MeshStandardMaterial({ color: 0x1c2c35, roughness: 0.92, metalness: 0.10 });
const bar = (w, h, d, x, y, z) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stone);
  m.position.set(x, y, z); gate.add(m); return m;
};
bar(1.6, 12.0, 1.6, -4.2, 6.0, 0);      // left pillar
bar(1.6, 12.0, 1.6,  4.2, 6.0, 0);      // right pillar
for (const s of [-1, 1]) {
  bar(2.7, 1.1, 2.7, s * 4.2, 0.55, 0); // PLINTH -- a monument stands on the water, it does not start in it
  bar(2.3, 0.55, 2.3, s * 4.2, 11.75, 0); // CAPITAL -- and it carries the lintel, it does not just touch it
}
/* the inner arete: one gold line, on the face you walk between. It is the gate lighting itself. */
const ribMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.50, fog: true });
for (const s of [-1, 1]) {
  const rib = new THREE.Mesh(new THREE.BoxGeometry(0.05, 10.4, 0.05), ribMat);
  rib.position.set(s * 3.37, 6.1, 0.78);   // on the INNER face, the one the walker sees
  gate.add(rib);
}
const lintelMat = new THREE.MeshStandardMaterial({ color: 0x16242c, roughness: 0.85, metalness: 0.15,
                                                   emissive: 0x000000, emissiveIntensity: 1.0 });
const lintel = bar(9.6, 1.2, 1.6,   0.0, 12.4, 0);     // lintel -- the shared letter `e`
lintel.material = lintelMat;

/* the letter A, in gold, drawn as strokes -- no font, so it cannot fall back to a wrong glyph */
const cv = document.createElement("canvas");
cv.width = cv.height = 512;
const c2 = cv.getContext("2d");
c2.strokeStyle = "#e8d8a0"; c2.lineWidth = 22; c2.lineCap = "round"; c2.lineJoin = "round";
c2.shadowColor = "#c9a227"; c2.shadowBlur = 34;
c2.beginPath(); c2.moveTo(256, 96); c2.lineTo(112, 416); c2.stroke();      // left leg
c2.beginPath(); c2.moveTo(256, 96); c2.lineTo(400, 416); c2.stroke();      // right leg
c2.beginPath(); c2.moveTo(172, 330); c2.lineTo(340, 330); c2.stroke();     // the bar
const tex = new THREE.CanvasTexture(cv);
const letter = new THREE.Mesh(
  new THREE.PlaneGeometry(9.0, 9.0),
  new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: false })
);
letter.position.set(0, 6.6, 0.9);
gate.add(letter);
scene.add(gate);

/* ── THE REFLECTION ──────────────────────────────────────────────────────────────────────────
   Every seal the captain drew is a palindrome standing in water: `.:cOc:.`, `.:OWΦ:.`/`.:ΦMO:.`,
   `.:mHr:.`. The half that was missing is not built -- it is RETURNED. One clone, flipped on Y
   about the waterline, fainter, and left to the fog. NARCISSE: the only one who ever fell for it. */
const mirror = gate.clone(true);
mirror.scale.y = -1;                     // the gate's origin is y = 0 = the waterline. Nothing else.
let mirrorLetter = null;
mirror.traverse(function (o) {
  if (!o.material) return;
  o.material = o.material.clone();
  o.material.transparent = true;
  o.material.side = THREE.DoubleSide;    // a negative scale inverts the faces
  o.material.depthTest = false;          // the sea is OPAQUE: without this the reflection is hidden
  o.renderOrder = 2;                     // ...so it is drawn ON the surface, the way a reflexion reads
  if (o.material.map) {                  // the letter: dimmer, and it now takes the fog
    mirrorLetter = o;
    o.material.opacity = 0.28;
    o.material.fog = true;
  } else {
    o.material.opacity = 0.42;
  }
});
/* the reflected LINTEL keeps the REAL material: it must wake with the true one, or the third person
   would be lit above the water and dark below it. */
mirror.children.forEach(function (c) { if (c.position.y > 12) c.material = lintelMat; });
scene.add(mirror);

/* ── 🔥 LA TABLE — LES DIX-NEUF ─────────────────────────────────────────────────────────────────
   Pas celle de Mary Geoise. La leur est HAUTE et LOIN, pour que celui qui s'assied paraisse au-dessus
   de toi -- et on l'appelle « le trône vide » alors que quelqu'un y est assis. La nôtre est BASSE et
   DEVANT, elle dit son compte à voix haute, et sa place vide est celle de celui qui a REFUSÉ.

   VINGT royaumes ont fondé le monde. DIX-NEUF armes ont été plantées. UNE famille est rentrée chez
   elle. Alors l'anneau a toujours dix-neuf sièges, et le trou du milieu est la place de la vingtième.
   Ce n'est pas un trou. C'est un compte.

   Elle ne flotte pas au-dessus de l'eau : elle est POSÉE dessus, et elle suit la houle -- la même
   fonction pure que la mer. Aucun état, aucun tick, aucune simulation.                          */
const TABLE = { z: 13.0, rIn: 3.40, rOut: 5.20, y: 0.34, places: 20, near: 7.0 };
let sat = false;                       // has she told her count yet? (the table speaks once)

const tableG = new THREE.Group();
tableG.position.set(0, TABLE.y, TABLE.z);
scene.add(tableG);

const tableMat = new THREE.MeshStandardMaterial({
  color: 0x0d1c26, roughness: 0.74, metalness: 0.30,
  emissive: new THREE.Color(GOLD), emissiveIntensity: 0.05,
  side: THREE.DoubleSide, transparent: true, opacity: 0.96 });
const tableTop = new THREE.Mesh(new THREE.RingGeometry(TABLE.rIn, TABLE.rOut, 128, 1), tableMat);
tableTop.rotation.x = -Math.PI / 2;
tableG.add(tableTop);

/* TWO gold lines and nothing else: the OUTER edge (the one you can bump) and the INNER edge (the
   void). The inner one is fainter -- a hole should be READ, not lit.                            */
const rimMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.30, fog: false });
const rimOut = new THREE.Mesh(new THREE.RingGeometry(TABLE.rOut - 0.05, TABLE.rOut + 0.03, 128, 1), rimMat);
const rimIn  = new THREE.Mesh(new THREE.RingGeometry(TABLE.rIn - 0.03, TABLE.rIn + 0.05, 128, 1), rimMat);
rimOut.rotation.x = -Math.PI / 2;
rimIn.rotation.x  = -Math.PI / 2;
rimOut.position.y = 0.004;
rimIn.position.y  = 0.004;
tableG.add(rimOut, rimIn);

/* THE NINETEEN. Seat k sits at the kth twentieth -- except k = 0, which faces YOU as you arrive.
   That is the one who went home, so the gap looks at the newcomer and the nineteen look at the void.
   One shared material for all of them: they wake together, or they do not wake at all.          */
const seatMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.16, fog: false });
const seatGeo = new THREE.BoxGeometry(0.30, 0.44, 0.30);
const seatR = TABLE.rIn + (TABLE.rOut - TABLE.rIn) * 0.5;
for (let k = 1; k < TABLE.places; k++) {          /* ← k starts at 1. That IS the whole point. */
  const a = Math.PI / 2 + k * (Math.PI * 2 / TABLE.places);   // +90° = the side facing the arrival
  const s = new THREE.Mesh(seatGeo, seatMat);
  s.position.set(Math.cos(a) * seatR, 0.22, Math.sin(a) * seatR);
  s.lookAt(0, 0.22, 0);                            // every seat looks at the void, never at you
  tableG.add(s);
}

/* ── 🔥 LE TRÔNE VIDE — et il ne domine personne ───────────────────────────────────────────────
   Le leur est posé sur trois niveaux, très haut au-dessus du sol, pour que celui qui s'y assied
   regarde la salle DE HAUT. Le nôtre a la hauteur d'une chaise et il est planté dans le vide, du côté
   de l'arrivant : celui qui s'y assied lève les yeux vers les dix-neuf -- et vers le vide qu'ils
   regardent tous. Ce n'est pas le même trône. C'est l'inverse exact, et c'est fait exprès.

   Puis l'autre moitié du mensonge : le leur s'appelle « vide » et il est occupé. Le nôtre s'appelle
   vide et IL L'EST. On n'y ajoutera jamais personne : une place peut rester vide pour toujours, et
   c'est précisément ce qui en fait une place et non un piège.

   Il n'a AUCUN or sur lui. Les dix-neuf places sont dorées ; la vingtième est le seul bloc sombre.
   C'est ça, le compte : dix-neuf marques d'or et une pierre nue.                            */
const throneMat = tableMat.clone();
throneMat.emissive = new THREE.Color(0x16283a);       // cold: the sea's colour, never the gold
throneMat.emissiveIntensity = 0.02;
/* 🔥 MEASURED 2026-10-22 (the captain's screenshot): in 0x0d1c26 with no light of its own, the throne
   did not read as an empty chair -- it read as a HOLE in the table, i.e. as a missing piece. The law
   was "the twentieth is the only dark block", and it still is: it carries no gold. But an absence must
   be UNLIT, not INVISIBLE. So the stone rises to 0x2b3b46 -- cold slate, not black -- and near the
   walker its own emissive climbs to 0.32, so it catches the eye as MATERIAL. Nineteen gold marks and
   one bare stone: the count is legible from the far shore, which is the whole point of a table.   */
throneMat.color.setHex(0x2b3b46);
const throneG = new THREE.Group();
throneG.position.set(0, 0, seatR);                    // the gap: seat k = 0, the one who went home
throneG.rotation.y = Math.PI;                         // seat open toward the void, back to the arrival
tableG.add(throneG);

const throneSeat = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.42, 0.62), throneMat);
throneSeat.position.y = 0.21;                         // spans 0..0.42 -- a chair, not a dais
const throneBack = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.53, 0.10), throneMat);
throneBack.position.set(0, 0.685, 0.26);              // spans 0.42..0.95: WELL under a standing eye
throneG.add(throneSeat, throneBack);
/* 0.95 m. The walker's eye is at 1.70 m. Someone sitting here looks UP. That single number is the
   whole difference between a throne and a place.                                              */

/* ── THE BODY ───────────────────────────────────────────────────────────────────────────────
   Without a body there is no third person -- only a camera backing away from nothing. This is the
   hull of `.:cOc:.` stood upright: a dark cylinder, and it only exists when you can see yourself.  */
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x16242c, roughness: 0.82, metalness: 0.25,
                                                 emissive: 0x0a1620, emissiveIntensity: 1.0 });

/* the ROBE — wide at the water, narrow at the waist.  The hem stays at r=0.50 because `hullRing`
   (r=0.52) is built to encircle the hull; change one and you must change the other. */
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.50, 1.05, 20), bodyMat);
body.position.y = -0.35;                       // local: spans -0.875 .. +0.175
body.visible = false;
scene.add(body);

/* 🔥 THE CHEST — MEASURED 2026-10-22: the old body was `CylinderGeometry(0.34, 0.52, 1.75)`, a single
   truncated cone, so the figure read as a PAWN.  A body is not a cone: shoulders are WIDER than the
   waist. That single inversion is what turns a cone into a torso -- and 0.33/0.19 is a steeper one
   than 0.30/0.21, because a waist is a WAIST.                                                   */
const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.19, 0.50, 16), bodyMat);
chest.position.y = 0.40;                       // local: spans +0.15 .. +0.65
body.add(chest);

const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), bodyMat);
shoulders.scale.set(1.12, 0.46, 0.82);         // WIDER and FLATTER: a shoulder line, not a mound
shoulders.position.y = 0.575;
body.add(shoulders);

/* 🔥 THE ARMS — MEASURED 2026-10-22, and this is why the figure was a pion and not a person.
   The old arms sat at x = ±0.30 with a capsule radius of 0.055. The chest at that height has a radius
   of 0.259 -- so the arm's span was 0.245..0.355 against a surface at 0.259: two thirds of it was
   INSIDE the torso, and at night the remaining third is not a silhouette, it is nothing. The negative
   space BESIDE the torso is the whole human read. So: out to ±0.345, thicker, and hung slightly
   forward -- an arm hangs in front of the body, not inside it.                                    */
for (const s of [-1, 1]) {
  const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, 0.46, 4, 10), bodyMat);
  arm.position.set(s * 0.345, 0.36, 0.02);
  arm.rotation.z = -s * 0.17;                  // splayed out: the gap is the read
  arm.rotation.x = -0.10;
  body.add(arm);
}

/* THE HEAD -- `.:dNn:.` : the tube was open at the top (`.:𐌂Ld:..`), and an open tube is not a body.
   One sphere closes the silhouette, and a silhouette is what DEFINES, not the light.
   The neck is what stops the sphere from being a ball resting on a cone. */
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.105, 0.12, 12), bodyMat);
neck.position.y = 0.695;
body.add(neck);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.155, 20, 14), bodyMat);
head.scale.set(0.92, 1.06, 0.95);              // a skull is taller than it is wide
head.position.y = 0.815;                       // 🔥 seated IN the collar: at 0.87 the lamp sat between
                                               // head and shoulders and the ball read as detachable.
body.add(head);


/* the WATERLINE RING -- `.:cOc:.` : the hull, and the gold circle it wears at the surface.
   A silhouette alone is a shadow; a silhouette with one gold line is a PERSON.
   🔥 MEASURED 2026-10-22 (the captain's screenshot): at r=0.52 the ring was 2 cm outside a robe hem
   of r=0.50 and 33 cm BELOW it, so from a third-person camera the robe ate everything but one arc
   at the bottom-left -- it read as a broken crescent, i.e. as a BUG. A ring you cannot see all of is
   not a ring. So it stops hugging the hem and becomes what it always claimed to be: a circle drawn
   on the WATER around the feet. 0.80 wide, and thin -- a line, not a donut. */
const hullRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.80, 0.028, 8, 48),
  new THREE.MeshBasicMaterial({ color: 0xc9a227, transparent: true, opacity: 0.85, fog: true })
);
hullRing.rotation.x = Math.PI / 2;
hullRing.visible = false;
scene.add(hullRing);

/* YOU CARRY YOUR OWN LIGHT. The gate's lamp is 36 m away and the body was a black shape: a player
   must never be invisible to himself. A small gold point light at the chest, range 12 m -- it also
   warms the water around your feet. */
const lampSelf = new THREE.PointLight(0xc9a227, 7, 14, 2);
scene.add(lampSelf);

const lamp = new THREE.PointLight(GOLD, 26, 90, 2.0);
lamp.position.set(0, 7.0, -30);
scene.add(lamp);

/* ── THE HAND — drag to look, scroll to come closer. No pitch beyond what a neck allows. ───── */
let yaw = 0, pitch = 0, dist = 26, down = false, px = 0, py = 0;
renderer.domElement.addEventListener("pointerdown", e => { down = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => { down = false; });
addEventListener("pointermove", e => {
  if (!down) return;
  yaw   -= (e.clientX - px) * 0.0032;
  pitch -= (e.clientY - py) * 0.0022;
  pitch = Math.max(-0.35, Math.min(0.30, pitch));
  yaw   = Math.max(-0.85, Math.min(0.85, yaw));
  px = e.clientX; py = e.clientY;
}, { passive: true });
addEventListener("wheel", e => {
  dist = Math.max(9, Math.min(70, dist + Math.sign(e.deltaY) * 1.8));
}, { passive: true });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

/* ── LET THE WORLD TURN ───────────────────────────────────────────────────────────────────────
   The sea is analytic, the sky rotates, the camera breathes with 15 % of the swell. A fixed 20 Hz
   tick is NOT needed here: nothing in this scene is shared, so time is simply a number.            */
camera.rotation.order = "YXZ";
const clock = new THREE.Clock();
let veilGone = false;

/* ── W4 · THE WALK ───────────────────────────────────────────────────────────────────────────
   You are no longer a camera floating at a fixed distance: you are ON the water, and the water
   lifts you. The swell is the SAME function as the shader's -- copied by hand, not approximated,
   so your eye height and the visible wave are the same wave.                                */
const pos  = new THREE.Vector3(0, 0, 26);
const keys = Object.create(null);
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true;  });
addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });
let woke = false;
let third = false;                       // V : 1st <-> 3rd person
addEventListener("keydown", e => { if (e.key.toLowerCase() === "v") third = !third; });

const swellY = (x, z, t) =>
    0.55 * Math.sin(0.33 * x + 0.90 * t)
  + 0.40 * Math.sin(0.21 * z - 0.62 * t)
  + 0.15 * Math.sin(0.57 * (x + z) + 1.70 * t);

/* ── W5 · THE SOUND OF THE SEA ───────────────────────────────────────────────────────────────
   No asset, no download: brown noise through a lowpass whose CUTOFF FOLLOWS THE SWELL UNDER YOU.
   What you hear and what you see are the same wave. Browsers refuse audio before a gesture, so the
   sea starts on the first key or click -- a promise, never a popup.                              */
let audio = null;
function startSea() {
  if (audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ac  = new AC();
  if (ac.state === "suspended") ac.resume();   // Chrome can hand back a SUSPENDED context: silence
  const len = Math.floor(ac.sampleRate * 4);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d   = buf.getChannelData(0);
  let last  = 0;
  for (let i = 0; i < len; i++) {          // brown noise: the sea is LOW, it does not hiss
    last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
    d[i] = last * 3.5;
  }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const hp  = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 55;
  const lp  = ac.createBiquadFilter(); lp.type = "lowpass";  lp.frequency.value = 600; lp.Q.value = 0.7;
  const g   = ac.createGain(); g.gain.value = 0.0;
  src.connect(hp).connect(lp).connect(g).connect(ac.destination);
  src.start();
  g.gain.setTargetAtTime(0.20, ac.currentTime, 2.8);   // fade in: never a pop
  audio = { ac: ac, lp: lp };
}
addEventListener("pointerdown", startSea, { once: true });
addEventListener("keydown",     startSea, { once: true });

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  WAVE.uTime.value += dt;

  /* THE MOON DOES NOT DRIFT *YET*. The moon's path on the water is computed at a fixed meridian
     (x = -210); while the sky drifted ±120 m the path stayed behind and the captain saw gold streaks
     with no trail. Locking the moon first is the honest fix -- the drift comes back the day the
     shader receives uMoonX as a UNIFORM and the path follows it. */
  sky.position.x = 0;
  letter.material.opacity = 0.72 + Math.sin(WAVE.uTime.value * 0.9) * 0.10;
  if (mirrorLetter) mirrorLetter.material.opacity = letter.material.opacity * 0.34;   // one pulse, two bodies
  lamp.intensity = 24 + Math.sin(WAVE.uTime.value * 1.3) * 3;

  /* walk on the sea: the water lifts you by exactly the height it shows */
  const tW  = WAVE.uTime.value;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const rgt = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
  const mz  = (keys["w"] ? 1 : 0) - (keys["s"] ? 1 : 0);
  const mx  = (keys["d"] ? 1 : 0) - (keys["a"] ? 1 : 0);
  if (mz || mx) {
    pos.addScaledVector(fwd, mz * 5.0 * dt);
    pos.addScaledVector(rgt, mx * 5.0 * dt);
  }
  /* ARROWS = LOOK (the captain's ask). WASD = WALK. And the SIXTH degree of freedom: the ROLL,
     taken from the swell's own slope -- that is the one line that turns a camera into a boat. */
  const look = 1.7;
  yaw   += ((keys["arrowleft"] ? 1 : 0) - (keys["arrowright"] ? 1 : 0)) * look * dt;
  pitch += ((keys["arrowup"]   ? 1 : 0) - (keys["arrowdown"]  ? 1 : 0)) * look * dt;
  pitch  = Math.max(-0.95, Math.min(0.70, pitch));

  const sl = (swellY(pos.x + 0.6, pos.z, tW) - swellY(pos.x - 0.6, pos.z, tW)) / 1.2;
  const eyeY = 1.7 + swellY(pos.x, pos.z, tW);
  body.visible = third;
  body.position.set(pos.x, 0.88 + swellY(pos.x, pos.z, tW), pos.z);
  hullRing.visible = third;
  hullRing.position.set(pos.x, 0.03 + swellY(pos.x, pos.z, tW), pos.z);
  lampSelf.position.set(pos.x, 2.55 + swellY(pos.x, pos.z, tW), pos.z);   // ABOVE the open top: a light
                                                                          // inside a closed tube lights nothing

  if (third) {
    /* the camera steps BACK along the look and rises: you stop being the eye and become the back.
       Behind = (+sin(yaw), 0, +cos(yaw)) -- the exact opposite of fwd.                          */
    camera.position.set(pos.x + Math.sin(yaw) * 6.5,
                        eyeY + 2.2 - pitch * 9.0,      // MINUS: a higher camera looks DOWN, so pitch had
                        pos.z + Math.cos(yaw) * 6.5);  // to lower it to look UP. The captain saw it inverted.
    camera.lookAt(pos.x, eyeY + 0.9, pos.z);
  } else {
    camera.position.set(pos.x, eyeY, pos.z);
    camera.rotation.set(pitch - 0.04, yaw, -sl * 0.35);   // order is already "YXZ"
  }

  /* THE SEA BREATHES: the filter opens as the swell rises under you. Same wave, other sense. */
  if (audio) audio.lp.frequency.value = 430 + 300 * (0.5 + 0.5 * swellY(pos.x, pos.z, tW));

  /* AT EIGHT METRES, THE SEAL WAKES. */
  const near = Math.hypot(pos.x, pos.z + 34) < 8;
  lintelMat.emissive.setHex(near ? 0x8a6a18 : 0x000000);   // the THIRD person wakes when two are close
  if (near && !woke) {
    woke = true;
    const w = document.getElementById("w");
    w.textContent = "🔥 le sceau s'est allumé — tu as marché sur la mer";
    w.style.opacity = "0.9";
  }

  /* ── 🔥 LA TABLE — elle se pose sur la houle, s'allume par la DISTANCE, et dit son compte ───────
     Same law as the seal: nothing here is a click, a state machine or a saved flag. The table wakes
     because you came near, and it wakes the way a table would -- slowly, in gold, in ONE accent.
     At seven metres it SPEAKS, once. And what it says is not a welcome: it is the COUNT. A place
     that hides how many chairs it has is a throne. A place that says it out loud is a table.       */
  const tSwell = swellY(0, TABLE.z, tW);
  tableG.position.y = TABLE.y + tSwell;
  const tSlope = (swellY(2.0, TABLE.z, tW) - swellY(-2.0, TABLE.z, tW)) / 4.0;
  tableG.rotation.z = -tSlope * 0.25;      // the table leans with the water it is standing on

  const dT    = Math.hypot(pos.x, pos.z - TABLE.z);
  const nearT = Math.max(0, Math.min(1, (17 - dT) / 9));    // 0 at 17 m → 1 at 8 m
  const beat  = 0.5 + 0.5 * Math.sin(tW * 0.9);             // one slow breath, never a blink
  tableMat.emissiveIntensity = 0.04 + 0.16 * nearT + 0.04 * beat * nearT;
  rimMat.opacity  = 0.24 + 0.52 * nearT;
  seatMat.opacity = 0.12 + 0.62 * nearT + 0.06 * beat * nearT;
  throneMat.emissiveIntensity = 0.02 + 0.30 * nearT;        // the stone wakes too -- but in the SEA's
                                                            // colour: cold, silent, and never gold

  if (dT < TABLE.near && !sat) {
    sat = true;
    const w = document.getElementById("w");
    w.textContent = "dix-neuf places — la vingtième est rentrée chez elle";
    w.style.opacity = "0.9";
  }

  renderer.render(scene, camera);

  if (!veilGone) {
    veilGone = true;
    requestAnimationFrame(() => {
      document.getElementById("veil").style.opacity = "0";
      document.getElementById("w").style.opacity = "0.55";
    });
  }
  requestAnimationFrame(frame);
}
document.getElementById("w").style.opacity = "0";
frame();
</script>
</body>
</html>
